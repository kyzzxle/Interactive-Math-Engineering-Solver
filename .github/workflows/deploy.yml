# Builds, tests and deploys the site to GitHub Pages on every push to "main".
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v5

      # siteUrl / customDomain in site.config.json take priority. If both are empty,
      # the address GitHub Pages reports (e.g. https://user.github.io/repo) is used.
      - name: Build the site
        run: node tools/build.mjs --site-url "${{ steps.pages.outputs.base_url }}"

      - name: Run tests and link checks
        run: npm test

      - name: Collect the files to publish
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '.claude' --exclude '_site' \
            --exclude 'node_modules' --exclude 'tools' --exclude 'tests' --exclude 'data' --exclude 'content' \
            --exclude '*.md' --exclude 'package.json' --exclude 'site.config.json' --exclude 'CNAME.example' \
            ./ _site/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
